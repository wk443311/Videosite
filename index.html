<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoHub - Premium Videos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #fff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    padding: 20px;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 30px 10px;
    border-bottom: 1px solid #222;
    margin-bottom: 30px;
  }

  .logo {
    font-size: 32px;
    font-weight: 800;
    color: #ff2d55;
    margin-bottom: 8px;
  }

  .subtitle {
    color: #888;
    font-size: 14px;
  }

  .notice-bar {
    background: #1a1a1a;
    border: 1px solid #ff2d55;
    border-radius: 10px;
    padding: 14px 20px;
    max-width: 800px;
    margin: 0 auto 30px;
    text-align: center;
    font-size: 14px;
    color: #ff6b9d;
  }

  /* Video Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .card {
    background: #151515;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #222;
    transition: 0.3s;
  }

  .card:hover {
    border-color: #ff2d55;
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(255,45,85,0.3);
  }

  .thumb-link {
    display: block;
    position: relative;
    width: 100%;
    aspect-ratio: 16/11;
    overflow: hidden;
    text-decoration: none;
  }

  .thumb-link img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: 0.4s;
  }

  .thumb-link:hover img {
    transform: scale(1.08);
  }

  .play-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 55px;
    height: 55px;
    background: rgba(255,45,85,0.9);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: #fff;
    padding-left: 4px;
    transition: 0.3s;
  }

  .thumb-link:hover .play-btn {
    background: #ff2d55;
    transform: translate(-50%, -50%) scale(1.15);
  }

  .badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: #ff2d55;
    color: #fff;
    font-size: 11px;
    font-weight: bold;
    padding: 4px 8px;
    border-radius: 4px;
  }

  .badge.new { background: #00c853; }

  .info {
    padding: 15px;
  }

  .title-link {
    display: block;
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    text-decoration: none;
    margin-bottom: 10px;
    transition: 0.3s;
  }

  .title-link:hover { color: #ff2d55; }

  .meta {
    display: flex;
    justify-content: space-between;
    color: #777;
    font-size: 12px;
    margin-bottom: 12px;
  }

  .download-btn {
    display: block;
    width: 100%;
    text-align: center;
    background: linear-gradient(90deg, #ff2d55, #ff6b9d);
    color: #fff;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    transition: 0.3s;
  }

  .download-btn:hover {
    box-shadow: 0 6px 20px rgba(255,45,85,0.5);
    transform: translateY(-2px);
  }

  /* Footer */
  footer {
    text-align: center;
    padding: 40px 20px;
    margin-top: 50px;
    border-top: 1px solid #222;
    color: #666;
    font-size: 13px;
  }

  .age-18 {
    display: inline-block;
    color: #ff2d55;
    border: 2px solid #ff2d55;
    width: 40px;
    height: 40px;
    line-height: 36px;
    border-radius: 50%;
    font-weight: bold;
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">🎬 VideoHub</div>
  <div class="subtitle">প্রিমিয়াম ভিডিও কালেকশন</div>
</div>

<!-- Notice Bar -->
<div class="notice-bar">
  🔞 <strong>নোটিশ:</strong> এই সাইটটি শুধুমাত্র ১৮+ ব্যবহারকারীদের জন্য। আপনি যদি ১৮ বছরের কম হন তাহলে এখনই প্রস্থান করুন।
</div>

<!-- Video Grid -->
<div class="grid" id="grid"></div>

<!-- Footer -->
<footer>
  <div class="age-18">18+</div>
  <p>© 2025 VideoHub। শুধুমাত্র ১৮+ ব্যবহারকারীদের জন্য।</p>
</footer>

<script>

}

grid.innerHTML = html;
</script>

</body>
</html>
